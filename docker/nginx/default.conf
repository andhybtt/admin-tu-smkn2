server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Include Cloudflare Real IP configuration
    include /etc/nginx/cloudflare.conf;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/tu_access.log main;
    error_log /var/log/nginx/tu_error.log warn;

    # Livewire & Web App Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel 11 Health Check Endpoint
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # Static Assets Caching (Vite build, images, fonts, PWA assets)
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|eot|svg|webp|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Service Worker & Manifest (Never cache service worker aggressively)
    location ~* (sw\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Pass Forwarded Proto to PHP for HTTPS detection
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_CF_RAY $http_cf_ray;
        fastcgi_param HTTP_CF_IPCOUNTRY $http_cf_ipcountry;

        include fastcgi_params;

        # FastCGI buffers and timeouts for Livewire uploads & reports
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 300;
    }

    # Deny access to sensitive hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}

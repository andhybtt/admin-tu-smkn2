version: '3.8'

# ==============================================================================
# Dokploy Docker Compose: SIM Administrasi TU SMKN Karanganyar
# Arsitektur Dual-Network Anti-Konflik IP & Database Terisolasi
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Service 1: Aplikasi Web TU (Laravel 11 + Livewire 3 + Apache PHP 8.2)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tu_smkn_app
    restart: unless-stopped
    expose:
      - 80
    environment:
      - APP_NAME=${APP_NAME:-SIM TU SMKN Karanganyar}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:-}
      - APP_URL=${APP_URL:-https://simtu.sknddev.com}
      - FORCE_HTTPS=true
      - APP_TIMEZONE=Asia/Jakarta
      - APP_LOCALE=id
      - APP_FALLBACK_LOCALE=id
      
      # Database Configuration (Mengarah ke hostname unik db_tu_smkn)
      - DB_CONNECTION=pgsql
      - DB_HOST=db_tu_smkn
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-tu_smkn_karanganyar}
      - DB_USERNAME=${DB_USERNAME:-tu_user}
      - DB_PASSWORD=${DB_PASSWORD:-PasswordDatabaseTu123!}
      
      # Storage & Cache Driver
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=public
    volumes:
      # Persistent volume untuk berkas arsip scan dokumen fisik TU
      - app_storage:/var/www/html/storage/app/public
    depends_on:
      db_tu_smkn:
        condition: service_healthy
    networks:
      - dokploy-network   # Jalur routing Dokploy Traefik (Domain & SSL)
      - tu_internal_net  # Jalur privat ke Database (Terisolasi dari project lain)

  # ----------------------------------------------------------------------------
  # Service 2: Database Server (PostgreSQL 16)
  # Menggunakan service name unik 'db_tu_smkn' agar kebal bentrok DNS Dokploy
  # ----------------------------------------------------------------------------
  db_tu_smkn:
    image: postgres:16-alpine
    container_name: tu_smkn_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tu_smkn_karanganyar}
      POSTGRES_USER: ${DB_USERNAME:-tu_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-PasswordDatabaseTu123!}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tu_user} -d ${DB_DATABASE:-tu_smkn_karanganyar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tu_internal_net  # HANYA terhubung ke network privat (Aman dari luar)

# ------------------------------------------------------------------------------
# Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  pg_data:
    name: tu_smkn_pg_data
  app_storage:
    name: tu_smkn_app_storage

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  # Network Dokploy bersama untuk reverse proxy Traefik
  dokploy-network:
    external: true

  # Network privat khusus project ini: menjamin koneksi DB tidak salah IP
  tu_internal_net:
    name: tu_smkn_internal_network
    driver: bridge
